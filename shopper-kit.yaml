name: 'Shopper Livewire Starter Kit'
description: 'A Livewire-powered storefront with reactive components for Shopper.'
version: 1.0.0
author: shopperlabs
url: 'https://github.com/shopperlabs/livewire-starter-kit'

shopper: ^2.9
php: ^8.4
laravel: ^11.48|^12.0|^13.0

dependencies:
  livewire/flux: ^2.9.0
  livewire/volt: ^1.7.0
  laravel/fortify: ^1.36
  shopper/stripe: ^2.9

dev_dependencies:
  laravel/boost: ^2.4

export_paths:
  - app/Actions
  - app/Concerns
  - app/DTO
  - app/Http/Controllers/StripeWebhookController.php
  - app/Http/Controllers/StripeReturnController.php
  - app/Livewire
  - app/Models
  - app/Providers
  - app/Traits
  - app/CheckoutSession.php
  - app/helpers.php
  - bootstrap/app.php
  - bootstrap/providers.php
  - config/fortify.php
  - config/livewire.php
  - config/shopper/models.php
  - database/factories/UserFactory.php
  - database/migrations/2025_09_02_075243_add_two_factor_columns_to_users_table.php
  - resources/views
  - resources/css
  - routes/web.php
  - routes/settings.php
  - tests

post_install:
  - php artisan migrate
  - php artisan storage:link
