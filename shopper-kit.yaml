name: 'Shopper Livewire Starter Kit'
description: 'A Livewire-powered storefront with reactive components for Shopper.'
version: 2.0.0
author: shopperlabs
url: 'https://github.com/shopperlabs/livewire-starter-kit'
preview: 'https://livewire-demo.shopperphp.com'
docs: 'https://github.com/shopperlabs/livewire-starter-kit/blob/3.x/README.md'
stack: [livewire, alpinejs, blade]

shopper: ^3.0
php: ^8.3
laravel: ^12.68|^13.27

dependencies:
  livewire/livewire: ^4.4
  livewire/flux: ^2.20
  livewire/blaze: ^1.0
  laravel/fortify: ^1.40
  danharrin/livewire-rate-limiting: ^2.3
  shopper/stripe: ^3.0

dev_dependencies:
  laravel/boost: ^2.10

screenshots:
  - .github/screenshots/home.webp
  - .github/screenshots/shop.webp
  - .github/screenshots/product.webp
  - .github/screenshots/cart.webp

export_paths:
  - app/Actions
  - app/Concerns
  - app/DTO
  - app/Http/Controllers/StripeWebhookController.php
  - app/Http/Controllers/StripeReturnController.php
  - app/Exceptions
  - app/Livewire
  - app/Models
  - app/Providers
  - app/Traits
  - app/helpers.php
  - bootstrap/app.php
  - bootstrap/providers.php
  - config/fortify.php
  - config/livewire.php
  - config/shopper/features.php
  - config/shopper/models.php
  - database/factories/UserFactory.php
  - database/migrations/2025_09_02_075243_add_two_factor_columns_to_users_table.php
  - resources/views
  - resources/css
  - routes/web.php
  - routes/settings.php
  - routes/webhooks.php
  - public/favicon.ico
  - public/favicon.svg
  - public/apple-touch-icon.png
  - tests

post_install:
  - php artisan migrate
  - php artisan storage:link
